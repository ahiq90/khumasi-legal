<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تم تأكيد الحساب — خماسي</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #16c172, #0b7a43);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff; border-radius: 24px; padding: 48px 32px;
    max-width: 460px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .check {
    width: 110px; height: 110px; margin: 0 auto 24px;
    border-radius: 50%; background: #e3f6ec;
    display: flex; align-items: center; justify-content: center;
    font-size: 60px; color: #0b7a43;
    animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  h1 { color: #15211b; font-size: 26px; margin-bottom: 12px; }
  p { color: #6b7d72; font-size: 15px; line-height: 1.8; margin-bottom: 28px; }
  .btn {
    display: inline-block; background: linear-gradient(135deg, #16c172, #0b7a43);
    color: white; padding: 14px 36px; border-radius: 14px;
    text-decoration: none; font-weight: 800; font-size: 15px;
    box-shadow: 0 6px 18px rgba(15,157,88,0.3);
  }
  .footer { margin-top: 32px; color: #6b7d72; font-size: 13px; }
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>تم تأكيد حسابك بنجاح</h1>
    <p>
      مرحباً بك في تطبيق <strong>خماسي</strong> ⚽<br/>
      يمكنك الآن العودة للتطبيق وتسجيل الدخول ببريدك وكلمة سرّك.
    </p>
    <a href="khumasi://login" class="btn">فتح التطبيق</a>
    <div class="footer">إذا لم يفتح التطبيق تلقائياً، افتحه من هاتفك يدوياً وسجّل الدخول.</div>
  </div>
</body>
</html>
