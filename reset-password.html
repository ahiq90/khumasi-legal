<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>إعادة تعيين كلمة السر — خماسي</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #16c172, #0b7a43);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff; border-radius: 24px; padding: 48px 32px;
    max-width: 460px; width: 100%; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .icon-wrap {
    width: 90px; height: 90px; margin: 0 auto 20px;
    border-radius: 50%; background: #e3f6ec;
    display: flex; align-items: center; justify-content: center;
    font-size: 44px;
  }
  h1 { color: #15211b; font-size: 24px; margin-bottom: 8px; }
  p.sub { color: #6b7d72; font-size: 14px; line-height: 1.7; margin-bottom: 24px; }
  .form-group { text-align: right; margin-bottom: 16px; }
  label { display: block; font-size: 14px; font-weight: 600; color: #15211b; margin-bottom: 6px; }
  input {
    width: 100%; padding: 14px 16px; border: 2px solid #dde8e2;
    border-radius: 14px; font-size: 15px; outline: none;
    transition: border-color 0.3s;
  }
  input:focus { border-color: #16c172; }
  .btn {
    display: block; width: 100%; background: linear-gradient(135deg, #16c172, #0b7a43);
    color: white; padding: 14px; border-radius: 14px; border: none;
    font-weight: 800; font-size: 16px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(15,157,88,0.3);
    margin-top: 8px;
  }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(15,157,88,0.4); }
  .error { color: #d32f2f; font-size: 13px; margin-top: 8px; text-align: right; }
  .success-view { display: none; }
  .success-view.show { display: block; }
  .form-view.hide { display: none; }
  .check {
    width: 90px; height: 90px; margin: 0 auto 20px;
    border-radius: 50%; background: #e3f6ec;
    display: flex; align-items: center; justify-content: center;
    font-size: 50px; color: #0b7a43;
    animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .btn-open {
    display: inline-block; background: linear-gradient(135deg, #16c172, #0b7a43);
    color: white; padding: 14px 36px; border-radius: 14px;
    text-decoration: none; font-weight: 800; font-size: 15px;
    box-shadow: 0 6px 18px rgba(15,157,88,0.3);
    margin-top: 16px;
  }
  .footer { margin-top: 24px; color: #6b7d72; font-size: 13px; }
  @keyframes pop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="card">
    <!-- نموذج إدخال كلمة السر الجديدة -->
    <div id="formView" class="form-view">
      <div class="icon-wrap">🔑</div>
      <h1>إعادة تعيين كلمة السر</h1>
      <p class="sub">أدخل كلمة السر الجديدة لحسابك في تطبيق خماسي</p>

      <div class="form-group">
        <label>كلمة السر الجديدة</label>
        <input type="password" id="newPass" placeholder="6 أحرف على الأقل" minlength="6" />
      </div>
      <div class="form-group">
        <label>تأكيد كلمة السر</label>
        <input type="password" id="confirmPass" placeholder="أعد كتابة كلمة السر" />
      </div>
      <div id="errorMsg" class="error"></div>
      <button class="btn" id="submitBtn" onclick="handleReset()">تأكيد كلمة السر الجديدة</button>
    </div>

    <!-- شاشة النجاح -->
    <div id="successView" class="success-view">
      <div class="check">✓</div>
      <h1>تم تغيير كلمة السر بنجاح</h1>
      <p class="sub">يمكنك الآن العودة للتطبيق وتسجيل الدخول بكلمة السر الجديدة.</p>
      <a href="khumasi://login" class="btn-open">فتح التطبيق</a>
      <div class="footer">إذا لم يفتح التطبيق تلقائياً، افتحه من هاتفك يدوياً وسجّل الدخول.</div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://alwrhmhkwkcfmjripxkl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_zmiHq3RXYrDEs9ydkaydxQ_R6C9YK2b';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // استخراج التوكن من الـ URL fragment
    async function initSession() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const access_token = params.get('access_token');
      const refresh_token = params.get('refresh_token');

      if (access_token && refresh_token) {
        await supabase.auth.setSession({ access_token, refresh_token });
      }
    }

    initSession();

    async function handleReset() {
      const newPass = document.getElementById('newPass').value;
      const confirmPass = document.getElementById('confirmPass').value;
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('submitBtn');

      errorMsg.textContent = '';

      if (newPass.length < 6) {
        errorMsg.textContent = 'كلمة السر يجب أن تكون 6 أحرف على الأقل';
        return;
      }
      if (newPass !== confirmPass) {
        errorMsg.textContent = 'كلمتا السر غير متطابقتين';
        return;
      }

      btn.disabled = true;
      btn.textContent = '⏳ جاري التحديث...';

      const { error } = await supabase.auth.updateUser({ password: newPass });

      if (error) {
        errorMsg.textContent = error.message || 'حدث خطأ. حاول مرة أخرى.';
        btn.disabled = false;
        btn.textContent = 'تأكيد كلمة السر الجديدة';
        return;
      }

      // نجاح!
      document.getElementById('formView').classList.add('hide');
      document.getElementById('successView').classList.add('show');
    }
  </script>
</body>
</html>
